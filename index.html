<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#E67E22">
  <meta name="description" content="每日晨读 - 你的个人知识日报">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>每日晨读</title>

  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">

  <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
  <div class="app-container">
    <!-- 头部 -->
    <header class="header">
      <div class="date-display">
        <h1 id="current-date"></h1>
        <p class="weekday" id="weekday"></p>
      </div>
      <div class="update-status" id="update-status">
        <span class="update-time" id="update-time"></span>
      </div>
    </header>

    <!-- 加载状态 -->
    <div class="loading-overlay" id="loading">
      <div class="loading-spinner"></div>
      <p>正在获取今日内容...</p>
    </div>

    <!-- 主要内容 -->
    <main class="main-content" id="main-content">
      <!-- 天气卡片 -->
      <section class="card weather-card" id="weather-card">
        <div class="card-header">
          <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
          </svg>
          <h2>今日天气</h2>
          <span class="weather-location" id="weather-location">📍 天津</span>
        </div>
        <div class="card-content weather-content">
          <div class="weather-main">
            <span class="weather-icon" id="weather-icon"></span>
            <span class="weather-temp" id="weather-temp"></span>
          </div>
          <p class="weather-condition" id="weather-condition"></p>
          <p class="weather-suggestion" id="weather-suggestion"></p>
        </div>
      </section>

      <!-- AI建议卡片 -->
      <section class="card tip-card" id="tip-card">
        <div class="card-header">
          <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/>
          </svg>
          <h2>今日灵感</h2>
          <span class="tip-category" id="tip-category"></span>
        </div>
        <div class="card-content">
          <p class="tip-text" id="tip-text"></p>
        </div>
      </section>

      <!-- AI新闻卡片 -->
      <section class="card news-card" id="news-card">
        <div class="card-header">
          <svg class="card-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/>
          </svg>
          <h2>AI 资讯</h2>
          <span class="news-week-label">本周精选</span>
        </div>
        <div class="card-content">
          <div class="news-list" id="news-list">
            <!-- 新闻条目由JS动态生成 -->
          </div>
        </div>
      </section>

      <!-- 安装提示 -->
      <div class="install-prompt" id="install-prompt" hidden>
        <p>点击 <strong>分享</strong> 按钮，选择 <strong>添加到主屏幕</strong>，即可像 App 一样使用</p>
        <button class="dismiss-btn" id="dismiss-install">知道了</button>
      </div>
    </main>

    <!-- 错误提示 -->
    <div class="error-toast" id="error-toast" hidden>
      <p id="error-message"></p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
